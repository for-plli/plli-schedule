name: 사이트 갱신

on:
  schedule:
    - cron: "7 0,12 * * *"   # 매일 한국 시간 09:07, 21:07
  workflow_dispatch:          # 수동 실행 버튼
  push:
    paths:                    # 아래 파일을 고치면 바로 갱신
      - "ticketing.txt"
      - "plave_extra.txt"
      - "template.html"
      - "build_site.py"

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사이트 만들기
        id: build
        continue-on-error: true
        run: python build_site.py
      - name: 바뀐 게 있으면 저장
        run: |
          if [ -n "$(git status --porcelain docs data)" ]; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git add docs data
            git commit -m "사이트 갱신"
            git push
          else
            echo "바뀐 내용 없음"
          fi
      - name: 공식 일정을 못 읽었으면 실패로 표시
        if: steps.build.outcome == 'failure'
        run: |
          echo "공식 사이트에서 일정을 읽지 못했습니다. 보관본으로 사이트는 만들었어요."
          exit 1
