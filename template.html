<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⏱️ 바쁘다 바빠 플리사회 🏃🏻‍♀️</title>
<meta name="description" content="플레이브 일정과 티켓팅·예약 알림을 한눈에 보는 비공식 팬 제작 캘린더">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플리스케줄">
<meta property="og:type" content="website">
<meta property="og:title" content="플리스케줄">
<meta property="og:description" content="플레이브 일정 · 티켓팅 알림을 한눈에 (비공식 팬 제작)">
<meta property="og:image" content="https://for-plli.github.io/schedule/og.png">
<meta property="og:url" content="https://for-plli.github.io/schedule/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* layout: 선택한 날짜(기본 오늘) 패널 -> 월/주 전환 + 전체/플레이브/플리 선택 -> 월간 또는 주간 달력 */
:root{
  --g-bg:#d9f1e1; --g-fg:#1d6b3f;
  --bg:#ffffff; --surface:#ffffff; --ink:#14172b; --muted:#5a6079; --line:#e0e3ef;
  --p:#5da3de; --p-ink:#ffffff; --p-bg:#e8f4fd; --p-fg:#2a6190; --p-bar:#99c8ee;
  --f:#c9779a; --f-ink:#ffffff; --f-bg:#fcf0f4; --f-fg:#7b3a56; --f-bar:#e3b0c4;
  --v:#8f84d6; --v-bg:#f0eefb; --v-fg:#4b4190; --v-bar:#c1b8ee;
  --n-bg:#eef2fb; --n-fg:#2b2f45;
  --sun:#c8707a; --sat:#5da3de; --sun-bg:#fbebee;
  --font-body:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --g-bg:#16352a; --g-fg:#8fd6ab;
    --bg:#0d0f19; --surface:#161927; --ink:#eceefa; --muted:#9ba1bc; --line:#282c40;
    --p:#8cc1ee; --p-ink:#0d0f19; --p-bg:#1a3149; --p-fg:#c6e3fa; --p-bar:#4f88b8;
    --f:#dc94b3; --f-ink:#0d0f19; --f-bg:#2f2029; --f-fg:#f0c8d8; --f-bar:#94586f;
    --v:#b5acec; --v-bg:#27223f; --v-fg:#d9d3f7; --v-bar:#6d62ad;
    --n-bg:#22263a; --n-fg:#dfe2f2;
    --sun:#e79aa3; --sat:#8fc4ef; --sun-bg:#36212a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --g-bg:#16352a; --g-fg:#8fd6ab;
  --bg:#0d0f19; --surface:#161927; --ink:#eceefa; --muted:#9ba1bc; --line:#282c40;
  --p:#8cc1ee; --p-ink:#0d0f19; --p-bg:#1a3149; --p-fg:#c6e3fa; --p-bar:#4f88b8;
  --f:#dc94b3; --f-ink:#0d0f19; --f-bg:#2f2029; --f-fg:#f0c8d8; --f-bar:#94586f;
    --v:#b5acec; --v-bg:#27223f; --v-fg:#d9d3f7; --v-bar:#6d62ad;
  --n-bg:#22263a; --n-fg:#dfe2f2;
  --sun:#e79aa3; --sat:#8fc4ef; --sun-bg:#36212a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 56px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}

.src-plave{--cb:var(--p-bg);--cf:var(--p-fg);--cbar:var(--p-bar)}
.src-fan{--cb:var(--f-bg);--cf:var(--f-fg);--cbar:var(--f-bar)}
.src-video{--cb:var(--v-bg);--cf:var(--v-fg);--cbar:var(--v-bar)}

/* 선택한 날짜 */
.sel{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px 18px 18px}
.sel .eyebrow{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 4px}
.seldate{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seldate .big{font-family:var(--font-num);font-weight:700;font-size:21px;line-height:1.2}
.seldate .dowl{font-family:var(--font-num);font-weight:700;font-size:21px;letter-spacing:-.03em;line-height:1.2;color:var(--ink)}
.seldate .dowl.sun{color:var(--sun)}
.seldate .dowl.sat{color:var(--sat)}
.badge{font-size:12px;font-weight:700;background:var(--ink);color:var(--surface);border:1px solid var(--ink);border-radius:2px;padding:1px 10px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{--tagh:18px;display:grid;align-items:start;grid-template-columns:104px 1fr;gap:12px;padding:10px 12px 10px 14px;background:var(--cb);border-left:5px solid var(--cbar);border-radius:2px}
.item .t{font-family:var(--font-num);font-weight:700;font-size:32px;line-height:1;text-box:trim-both cap alphabetic;margin-top:calc((var(--tagh) - .7em)/2 + 1.7px);font-variant-numeric:tabular-nums;color:var(--cf)}
.item .t.allday{font-family:var(--font-body);font-size:20px}
.item .ti{font-weight:500;font-size:16px;overflow-wrap:anywhere}
.item .who{display:inline-block;font-size:11px;font-weight:700;color:var(--cf);border:1px solid var(--cbar);border-radius:2px;padding:0 7px;margin-bottom:3px;height:var(--tagh);line-height:calc(var(--tagh) - 2px);box-sizing:border-box}
.memo{font-size:13px;color:var(--cf);opacity:.85;margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.links a{font-size:12.5px;color:var(--cf);text-decoration:none;background:var(--surface);border:1px solid var(--cbar);border-radius:2px;padding:2px 10px}
.links a:hover{text-decoration:underline}
.empty{color:var(--muted);font-size:14.5px;margin:0}
.next{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:14.5px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.num,.item .t,.chip b,.seldate .big,.bar .title,.wh .d,.wev .wt,.next .nd,.next .dd{font-weight:600;font-variant-numeric:tabular-nums}
/* 자간: 프리텐다드는 큰 글씨에서 벌어져 보여서 크기가 클수록 더 좁혀요 */
body{letter-spacing:-.01em}
.item .t,.seldate .big,.bar .title,.wh .d,.wev .wt{letter-spacing:-.03em}
.num,.chip b,.next .nd,.next .dd{letter-spacing:-.02em}
.next .nl{color:var(--muted);font-size:12.5px;font-weight:700}
.next .nd{font-family:var(--font-num);font-weight:700}
.next .nt{color:var(--ink)}
.next .dd{margin-left:auto;font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--p-fg);background:var(--p-bg);border-radius:2px;padding:1px 6px}

/* 컨트롤 */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.lhs{display:flex;align-items:center;gap:12px}
.vidbtn{border:1px solid var(--v-bar);background:var(--v-bg);color:var(--v-fg);border-radius:2px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer}
.vidbtn[aria-pressed="true"]{background:var(--v);border-color:var(--v);color:var(--surface)}
.row1,.row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{font-weight:700;background:var(--n-bg);color:var(--n-fg)}
.seg button[data-k="plave"][aria-pressed="true"]{background:var(--p-bg);color:var(--p-fg)}
.seg button[data-k="fan"][aria-pressed="true"]{background:var(--f-bg);color:var(--f-fg)}

.cal{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px}
.bar .title{font-family:var(--font-num);font-size:21px;font-weight:700;min-width:7.5em;text-align:center}
.nav{width:36px;height:36px;border-radius:2px;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.nav .chev{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.today-btn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.note{margin:0;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:2px;padding:8px 12px}

/* 월간 */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.dow{background:var(--surface);text-align:center;font-size:12px;font-weight:700;padding:6px 0;color:var(--muted)}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.day,.blank{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;min-width:0}
.blank{background:var(--bg)}
.day{cursor:pointer}
.numrow{display:flex;align-items:center;justify-content:space-between;gap:2px;height:26px}
.mk{font-size:10px;line-height:1;display:inline-flex;align-items:center;height:100%;margin-right:8px}
.day:focus,.day:focus-visible{outline:none}
.num{font-family:var(--font-num);font-weight:700;font-size:15px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.day.sun .num{color:var(--sun)} .day.sat .num{color:var(--sat)}
.day.today .num{background:var(--ink);color:var(--surface)}
.num .nn{display:block;line-height:1}
@supports (text-box:trim-both cap alphabetic){.num .nn{text-box:trim-both cap alphabetic}}
.chip{font-size:11.5px;line-height:1.3;padding:3px 5px;border-radius:2px;background:var(--cb);color:var(--cf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chip b{font-family:var(--font-num);font-weight:700;font-size:12px;margin-right:4px}
.more{font-size:11px;color:var(--muted);padding-left:2px}
.more2{display:none}
.ct-short{display:none}
.sh{display:inline-block;margin-right:4px;font-weight:700}
.chip.strong,.chip.strong *{color:#fff !important}
.item.gbox{--cb:var(--g-bg);--cf:var(--g-fg);--cbar:#6cc08f}
.chip.gchip{background:var(--g-bg);color:var(--g-fg)}
.chip.gchip *{color:var(--g-fg)}
.chip.strong{box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.chip.strong .lv{background:transparent;padding:0;border-radius:0}
.lv.cn{background:#2f5fc4;font-weight:800}
.lv{display:inline-block;background:#26304d;color:#fff;border-radius:2px;padding:2px 5px;line-height:1.35;white-space:nowrap;font-size:.92em;vertical-align:middle;position:relative;top:-.12em}
.chip .em{font-size:.92em;line-height:1}
.chip .tem{display:inline-block;width:1.1em;text-align:center;font-size:.72em;line-height:1;margin-left:2px;vertical-align:middle;position:relative;top:-.12em}
.src-video:not(.is-short) .ct-full,.src-video:not(.is-short) .ct-short{font-weight:700}   /* 영상 칸의 첫 줄은 굵게 */
.ct-hearts{white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cbar)}

/* 주간 */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:2px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.wcol.selected{box-shadow:0 0 0 2px var(--p-bar)}
.wh{border:0;background:transparent;cursor:pointer;text-align:left;padding:8px 10px;display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line)}
.wh .d{font-family:var(--font-num);font-weight:700;font-size:24px;line-height:1.1}
.wh .w{font-size:13px;font-weight:700}
.wh.sun .d,.wh.sun .w{color:var(--sun)} .wh.sat .d,.wh.sat .w{color:var(--sat)}
.wcol.today .wh{background:var(--p-bg);color:var(--p-fg)}
.wcol.today .wh .d,.wcol.today .wh .w{color:var(--p-fg)}
.wlist{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:60px}
.wev{background:var(--cb);color:var(--cf);border-left:4px solid var(--cbar);border-radius:2px;padding:5px 7px;min-width:0}
.wev .wt{font-family:var(--font-num);font-weight:700;font-size:17px;line-height:1.15;font-variant-numeric:tabular-nums}
.wev .wt.allday{font-family:var(--font-body);font-size:13px}
.wev .wn{font-size:12.5px;overflow-wrap:anywhere}
.wnone{color:var(--muted);font-size:12.5px;margin:0}

/* 날짜 팝업 */
dialog.daydlg{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:2px;width:min(520px,calc(100% - 24px));max-height:82vh;box-shadow:0 12px 40px rgba(20,23,43,.25);overflow:hidden}
dialog.daydlg::backdrop{background:rgba(20,23,43,.38)}
.dlg-in{padding:16px 16px 20px;overflow:auto;max-height:82vh;position:relative}
.dlg-x{position:absolute;top:8px;right:10px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:6px 8px;cursor:pointer}
.dlg-x:focus,.dlg-x:focus-visible,dialog.daydlg:focus,dialog.daydlg:focus-visible,.dlg-in:focus{outline:none}
.dlg-in .seldate{padding-right:36px;margin-bottom:8px}
.daydlg .seldate{margin-bottom:10px;gap:6px}
.daydlg .seldate .big,.daydlg .seldate .dowl{font-size:15px}
.daydlg .eyebrow{display:none}
.daydlg .items{gap:8px}
.daydlg .item{grid-template-columns:58px 1fr;gap:8px;padding:7px 10px 7px 10px;border-left-width:4px}
.daydlg .item .t{font-size:16px}
.daydlg .item .t.allday{font-size:13px}
.daydlg .item .ti{font-size:13.5px}
.daydlg .item .who{font-size:10.5px}
.item.no-time,.daydlg .item.no-time{grid-template-columns:1fr}
.daydlg .item .memo{font-size:12px}
.daydlg .links a{font-size:11px;padding:1px 8px}
footer{color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:2px;text-align:center;align-items:center}

@media (max-width:760px){
  .week{grid-template-columns:1fr}
  .wcol{flex-direction:row}
  .wh{flex-direction:column;align-items:flex-start;gap:0;width:64px;flex:0 0 64px;border-bottom:0;border-right:1px solid var(--line)}
  .wlist{flex:1}
}
@media (max-width:600px){
  body{font-size:13.5px}
  .wrap{padding:10px 12px 36px;gap:10px}
  h1{font-size:15px}
  /* 오늘 패널 */
  .sel{padding:10px 12px 12px;border-radius:2px}
  .sel .eyebrow{font-size:11px;margin-bottom:2px}
  .seldate{margin-bottom:8px;gap:6px}
  .seldate .big,.seldate .dowl{font-size:15px}
  .badge{font-size:11px;padding:0 8px}
  .items{gap:6px}
  .item{grid-template-columns:62px 1fr;gap:8px;padding:6px 8px 6px 10px;border-left-width:4px}
  .item .t{font-size:19px}
  .item .t.allday{font-size:13px}
  .item .ti{font-size:13.5px}
  .item .who{font-size:10px;padding:0 6px}
  .memo{font-size:12px}
  .links a{font-size:11px;padding:1px 8px}
  .empty{font-size:13px}
  /* 컨트롤 */
  .row1{flex-wrap:nowrap;gap:6px}
  .sfx{display:none}
  .seg{border-radius:2px}
  .seg button{padding:4px 8px;font-size:12px}
  .vidbtn{padding:4px 9px;font-size:12px}
  .lhs{gap:9px}
  .nav{width:26px;height:26px;border-radius:2px}
  .nav .chev{width:13px;height:13px}
  .bar{gap:4px}
  .bar .title{font-size:13.5px;min-width:5.6em}
  .today-btn{padding:4px 11px;font-size:12px}
  .cal{gap:8px}
  /* 월간 달력 */
  .grid{border-radius:2px}
  .dow{font-size:11px;padding:5px 0}
  .day,.blank{min-height:78px;padding:3px 2px;gap:2px}
  .num{font-size:12.5px;width:22px;height:22px}
  .numrow{height:22px}
  .mk{font-size:9px;margin-right:4px}
  .more{display:none}
  .more2{display:block;font-size:9px;color:var(--muted);padding-left:2px;line-height:1.2}
  .chip{font-size:8.5px;line-height:1.25;padding:2.5px 3px;white-space:normal}
  .chip:nth-of-type(n+4){display:none}
  .chip b{display:block;font-size:9.5px;margin:0}
  .ct-full{display:none}
  .sh{display:block;margin-right:0;font-size:inherit;line-height:1.2}
  .ct-hearts{display:block;font-size:8px;line-height:1.2}
  .ct-short{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .note{font-size:12px;padding:6px 10px}
  footer{font-size:11px}
  /* 팝업 */
  dialog.daydlg{margin:auto;width:calc(100% - 32px);max-width:420px;border-radius:2px;max-height:70vh}
  .dlg-in{max-height:70vh}
}
/* ===== v2 디자인: 박스·선·색을 줄이고 둥글기는 큰 영역 14 / 작은 것 6 ===== */
.sel{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;border-radius:14px;padding:14px 16px}
.sel .eyebrow{grid-column:1;grid-row:1;justify-self:start;margin:0;font-size:10.5px;font-weight:700;background:var(--n-bg);color:var(--n-fg);border-radius:999px;padding:2px 9px;line-height:1.5}
.sel .seldate{grid-column:2;grid-row:1;margin:0}
.sel .items{grid-column:1 / -1;margin-top:8px}
.sel .empty{font-size:13px;margin:0}
.sel .next{margin:10px 0 0;padding:10px 0 0;font-size:13px;flex-wrap:nowrap;align-items:center;gap:8px}
.sel .next .nl{font-size:13px;font-weight:500;color:var(--muted)}
.sel .next .nd{font-size:13px;font-weight:700}
.sel .next .nt{font-size:13px;font-weight:400}
.sel .next .dd{border-radius:999px;padding:1px 9px;font-size:12px}
.sel .next .nl,.sel .next .nd,.sel .next .dd{flex:0 0 auto;white-space:nowrap}
.sel .next .nt{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel .next .dd{margin-left:0}
.item,.daydlg .item{border-radius:6px;border-left-width:0}
.item .who{border-radius:999px}
.links a{border-radius:999px}
.chip{border-radius:6px}
.grid{border:0;border-radius:0;background:transparent;gap:0}
.dow,.dow.sun,.dow.sat{background:transparent;border-bottom:1px solid var(--line)}
.dow{padding:10px 0;font-size:13px;font-weight:600}
.day,.blank,.day.sun,.day.sat{background:transparent;border:0;border-bottom:1px solid var(--line)}
.day:nth-last-child(-n+7),.blank:nth-last-child(-n+7){border-bottom:0}
.num{justify-content:flex-start}
.day.today .num{justify-content:center}
.numrow{padding-left:4px}
dialog.daydlg{border-radius:14px}
.dlg-x{width:32px;height:32px;border-radius:50%;background:var(--n-bg);top:16px;right:16px;padding:0;font-size:15px;display:inline-flex;align-items:center;justify-content:center}

/* 컨트롤: 필터 아이콘(전체·플레이브·플리) + 영상 알약 */
.lhs{display:flex;align-items:center;gap:6px}
.fwrap{position:relative}
.fbtn,.vidbtn{height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1}
.fbtn{width:36px;border-radius:50%}
.vidbtn{gap:5px;padding:0 13px 0 10px;border-radius:999px;font-size:13px;font-weight:600}
.fi{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.vidbtn .fi{width:16px;height:16px}
.fbtn.on,.vidbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fbtn.dim{opacity:.4}
.fpop{position:absolute;left:0;top:44px;z-index:5;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(20,23,43,.14);padding:6px}
.fpop[hidden]{display:none}
.fpop button{display:flex;width:100%;justify-content:space-between;align-items:center;height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.fpop button[aria-pressed="true"]{font-weight:700}
.fpop .ck{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.fpop button[aria-pressed="true"] .ck{visibility:visible}
.bar .nav{border:0;background:transparent;border-radius:0;width:28px;height:28px}
.bar .nav .chev{width:18px;height:18px;stroke-width:2.8}
.row1{margin-bottom:-4px}

/* 오늘 카드: '오늘'이 제목, 날짜는 보조 */
.sel .eyebrow{font-size:19px;font-weight:700;background:transparent;color:var(--ink);padding:0;border-radius:0;line-height:1.2}
.sel .seldate .big,.sel .seldate .dowl{font-size:14px;font-weight:600;color:var(--muted)}
.sel .seldate .dowl.sun{color:var(--sun)}
.sel .seldate .dowl.sat{color:var(--sat)}
.sel{column-gap:10px;align-items:baseline}
.sel .seldate{align-items:baseline}
/* 깔때기는 윗부분이 넓어 시각 중심이 위로 쏠려서 살짝 내림 */
.fbtn .fi{transform:translateY(.5px)}

/* 알람받기: 푸터의 작은 버튼 + 안내 팝업 */
.alarmbtn{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 11px 0 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;margin-bottom:6px}
.alarmbtn .fi{width:14px;height:14px}
dialog.alarmdlg{width:min(360px,calc(100% - 32px))}
.alarmdlg .dlg-in{padding:20px 20px 22px;font-size:13px;line-height:1.55}
.alarmdlg p{margin:0;word-break:keep-all}
dialog.alarmdlg{border:1px solid var(--line)}
.alarmdlg .al-t{font-size:16px;font-weight:700;padding-right:36px}
.alarmdlg .al-d{color:var(--muted);margin:4px 0 14px}
.alarmdlg .al-sec{border-top:1px solid var(--line);padding:12px 0 0;margin-top:12px;color:var(--muted)}
.alarmdlg .al-sec b{color:var(--ink)}
.alarmdlg .al-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.alarmdlg .al-h b{font-size:14px}
.alarmdlg .al-go{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:12px;font-weight:700;text-decoration:none}

/* 달력과 안내 문구 사이 구분선 */
footer{border-top:1px solid var(--line);padding-top:16px;margin-top:4px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;font-size:11.5px;line-height:1.5}
footer .alarmbtn{margin:0 0 8px}

@media (max-width:600px){
  .wrap{padding:16px 20px 40px;gap:14px}
  .sel{padding:14px 16px}
  .item,.daydlg .item{padding:10px 14px}
  .item .who{font-size:10.5px;padding:0 8px}
  .bar{gap:0}
  .bar .title{font-size:13.5px;min-width:0;white-space:nowrap}
  .lhs{gap:6px}
  .row1{gap:4px}
  .day,.blank{min-height:88px;padding:8px 3px 6px;gap:2px}
  .numrow{height:22px}
  .num{font-size:14px;width:22px;height:22px}
  .day.today .num{width:24px;height:24px}
  .chip{font-size:9.5px;padding:2px 3px;line-height:1.35;letter-spacing:-.03em}
  .chip b{font-size:10px;margin-right:2px}
  .chip .sh{font-size:10px;line-height:inherit;font-family:var(--font-num);letter-spacing:-.02em}   /* 영상 칩 첫 줄 = 일정 칩의 시간 줄과 동일 */
  .chip .ct-hearts{font-size:inherit;line-height:inherit}
  .more{font-size:9.5px}
  dialog.daydlg{border-radius:14px}
  .dlg-in{padding:22px 20px 24px}
  .daydlg .seldate .big,.daydlg .seldate .dowl{font-size:17px;font-weight:700;color:var(--ink)}
  .daydlg .seldate .dowl.sun{color:var(--sun)}
  .daydlg .seldate .dowl.sat{color:var(--sat)}
}

/* 색 2가지(플레이브·플리) + 진한 칸 = 릴리즈·콘서트(생일은 멤버 색), 지난 날짜 흐리게, 폰 아이콘 칩, 범례 */
:root{--g-bg:var(--p-bg);--g-fg:var(--p-fg)}
.chip.gchip{background:var(--p);color:var(--p-ink)}
.chip.gchip *{color:var(--p-ink)}
.day.past .chip,.day.past .more,.day.past .more2{opacity:.42}
.day.past .num .nn{opacity:.45}
.chip .ico{display:none}
.chip b{word-break:keep-all}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-6px 0 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg-p{background:var(--p-bg);box-shadow:inset 0 0 0 1px var(--p-bar)}
.lg-f{background:var(--f-bg);box-shadow:inset 0 0 0 1px var(--f-bar)}
.lg-s{background:var(--p)}
.legend[hidden]{display:none}
@media (max-width:600px){
  .chip.has-ico .ct-short{display:none}
  .chip.has-ico .ico{display:block;line-height:1.35;font-size:10px}
}
</style>

<script>
var RAW = __DATA__;
var DOW = ["일","월","화","수","목","금","토"];
var DOWL = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
var LOADED = __LOADED__;
var UPDATED = "__UPDATED__";
var SRC_NAME = {plave:"플레이브", fan:"플리", video:"영상"};

function pad(n){ return String(n).padStart(2,"0"); }
function kst(ms){ return new Date(ms + 9*3600000); }
function keyOf(d){ return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
function parseKey(k){ var p = k.split("-").map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])); }
function addDays(k,n){ var d = parseKey(k); d.setUTCDate(d.getUTCDate()+n); return keyOf(d); }
function hostLabel(u){
  if(u.indexOf("youtu")>-1) return "YouTube";
  if(u.indexOf("weverse")>-1) return "Weverse";
  return "링크";
}
function norm(e, src){
  var ms = Date.parse(e.utcStart);
  var allDay = !!e.isAllDay;
  var d = allDay ? new Date(ms) : kst(ms);
  return {
    id:e.id, title:(e.channel && String(e.title).indexOf("[Shorts] ") !== 0 ? "["+e.channel+"] " : "")+String(e.title).replace(/💗/g,"🩷"), ch:(e.channel||""), ms:ms, allDay:allDay, key:keyOf(d), src:src,
    time: allDay ? "종일" : pad(d.getUTCHours())+":"+pad(d.getUTCMinutes()),
    note: e.note || "",
    links:(e.links||[]).map(function(l){return l.url;}).filter(function(u){return typeof u==="string" && u.indexOf("https://")===0;})
  };
}
/* 플리 일정(티켓팅·예약): 한 번만 있는 일정은 FAN_RAW 에, 매달 반복되는 일정은 FAN_MONTHLY 에 적습니다. */
var FAN_RAW = __FAN__;
var FAN_MONTHLY = __FAN_MONTHLY__;   /* ticketing.txt 의 '매월 N번째 요일 시각' 줄 */
var REPEAT_FROM = "__REPEAT_FROM__", REPEAT_UNTIL = "__REPEAT_UNTIL__";
function monthlyEvents(){
  var out = [];
  var a = REPEAT_FROM.split("-").map(Number), b = REPEAT_UNTIL.split("-").map(Number);
  for(var y=a[0], m=a[1]; y*12+m <= b[0]*12+b[1]; m++){
    if(m === 13){ y++; m = 1; }
    FAN_MONTHLY.forEach(function(r){
      var first = new Date(Date.UTC(y,m-1,1)).getUTCDay();
      var day = 1 + (r.dow - first + 7) % 7 + 7*(r.nth-1);
      if(day > new Date(Date.UTC(y,m,0)).getUTCDate()) return;
      var ms = Date.UTC(y,m-1,day,r.hour-9,r.minute);
      out.push({id:"fan-"+r.id+"-"+y+"-"+pad(m), title:r.title, utcStart:new Date(ms).toISOString(), isAllDay:false, note:r.note||"", links:r.links||[]});
    });
  }
  return out;
}
/* 공식 사이트에 아직 없지만 플레이브 일정으로 보여줄 것(공연 등) */
var PLAVE_EXTRA = __PLAVE_EXTRA__;
/* 공식 유튜브 새 영상 (영상 탭을 눌렀을 때만 보여요) */
var VIDEOS = __VIDEOS__;
/* 시간이 정해진 릴리즈: 10월처럼 종일 릴리즈 칸을 먼저 두고, 그 아래 시간 일정을 따로 둡니다 */
function splitRelease(list){
  var out = [];
  list.forEach(function(e){
    if(!e.isAllDay && /\bRELEASE\b/i.test(e.title)){
      var k = kst(Date.parse(e.utcStart));
      out.push({id:e.id+"-day", title:e.title, utcStart:new Date(Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate())).toISOString(), isAllDay:true, links:e.links||[]});
      var c = {}; for(var key in e) c[key] = e[key];
      c.title = e.title.replace(/\s*\bRELEASE\b\s*/i," 발매").replace(/\s+$/,"");
      out.push(c);
    } else out.push(e);
  });
  return out;
}
var ALL = splitRelease(RAW.concat(PLAVE_EXTRA)).map(function(e){return norm(e,"plave");})
  .concat(FAN_RAW.concat(monthlyEvents()).map(function(e){return norm(e,"fan");}))
  .concat(VIDEOS.map(function(e){return norm(e,"video");}));
ALL.sort(function(a,b){
  if(a.key !== b.key) return a.key < b.key ? -1 : 1;
  if(a.allDay !== b.allDay) return a.allDay ? -1 : 1;
  return a.ms - b.ms;
});

var todayKey = keyOf(kst(Date.now()));
var state = { sel: todayKey, view: "month", show: "all" };

function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
/* 글자 속 이모지는 글씨보다 작게 (칸에서만 사용) */
var EMO_RE = null;
try{ EMO_RE = new RegExp("(\\p{Extended_Pictographic}\\uFE0F?(?:\\u200D\\p{Extended_Pictographic}\\uFE0F?)*)", "u"); }catch(err){}
var EMO_LEAD = null;
try{ EMO_LEAD = new RegExp("^(?:\\p{Extended_Pictographic}\\uFE0F?\\s*)+", "u"); }catch(err){}
function rich(node, text){
  if(!EMO_RE){ node.appendChild(document.createTextNode(text)); return node; }
  text.split(EMO_RE).forEach(function(p, i){
    if(!p) return;
    if(i % 2){ var m = document.createElement("span"); m.className = "em"; m.textContent = p; node.appendChild(m); }
    else node.appendChild(document.createTextNode(p));
  });
  return node;
}
function visible(e){ return state.show === "all" ? e.src !== "video" : state.show === e.src; }
function officialShown(){ return state.show === "all" || state.show === "plave"; }
function eventsOn(key){ return ALL.filter(function(e){ return e.key === key && visible(e); }); }
function dowOf(key){ return parseKey(key).getUTCDay(); }
function monthOf(key){ return key.slice(0,7); }
function monthName(ym){ var p = ym.split("-").map(Number); return p[0]+"년 "+p[1]+"월"; }

function selectKey(k){
  state.sel = k;
  render();
  openDay();
}

function openDay(){
  fillDay(state.sel, "d-eyebrow", "d-seldate", "d-items");
  var d = document.getElementById("daydlg");
  document.getElementById("dlgin").scrollTop = 0;
  try{ if(!d.open){ if(d.showModal) d.showModal(); else d.setAttribute("open",""); } }
  catch(x){ d.setAttribute("open",""); }
}
function closeDay(){
  var d = document.getElementById("daydlg");
  try{ if(d.close) d.close(); else d.removeAttribute("open"); }catch(x){ d.removeAttribute("open"); }
}

function renderSelected(){
  // 오늘 카드는 필터(플레이브/플리/영상)와 상관없이 항상 '전체' 기준으로 고정
  var keep = state.show;
  state.show = "all";
  try{ fillDay(todayKey, "eyebrow", "seldate", "items", true); }
  finally{ state.show = keep; }
}

/* 오늘 일정이 없을 때 보여줄 '다음 일정' (영상 제외, 지금 고른 필터를 따름) */
function nextLine(key){
  var n = null;
  for(var i=0;i<ALL.length;i++){ if(ALL[i].key > key && visible(ALL[i])){ n = ALL[i]; break; } }
  if(!n) return null;
  var t = n.title.replace(/^\s*PLAVE\s*(?:\(\s*플레이브\s*\))?\s*[-–:|·]?\s*/i, "") || n.title;
  if(n.src === "plave"){
    var c = cellTitle(n.title, "plave");
    if(/^[💙💜🩷💗❤️❤🖤\s]+$/.test(c)){ t = n.title; }                    // 위버스 라이브: 하트만이면 제목 그대로
    else if(/KEEP IT MANIC|CONCERT|콘서트/i.test(t)){ t = c.replace(/^\S+\s/, "").replace(/\s*Concert$/i, "") + " Concert"; }
    else if(n.allDay && /\bRELEASE\b/i.test(n.title)){ t = "릴리즈 " + c; }
    else if(n.allDay && /'s\s+day/i.test(n.title)){ t = "생일 " + (n.title.match(/happy\s+(.+?)['’]s\s+day/i) || [0, c])[1]; }
  }
  var a = parseKey(key), b = parseKey(n.key);
  var days = Math.round((b - a) / 86400000);
  var p = n.key.split("-").map(Number), wd = dowOf(n.key);
  var line = el("p","next");
  line.appendChild(el("span","nl","다음 일정"));
  line.appendChild(el("span","nd",p[1]+"/"+p[2]+"("+DOWL[wd].charAt(0)+")"+(n.allDay ? "" : " "+n.time)));
  line.appendChild(el("span","nt",t));
  line.appendChild(el("span","dd","D-"+days));
  return line;
}
function fillDay(key, eyebrowId, headId, itemsId, hideAllDay){
  var p = key.split("-").map(Number);
  var wd = dowOf(key);
  document.getElementById(eyebrowId).textContent = key === todayKey ? "오늘" : "선택한 날짜의 일정";
  var head = document.getElementById(headId);
  head.textContent = "";
  head.appendChild(el("span","big",p[1]+"월 "+p[2]+"일"));
  head.appendChild(el("span","dowl"+(wd===0?" sun":wd===6?" sat":""),"("+DOWL[wd].charAt(0)+")"));

  var ul = document.getElementById(itemsId);
  ul.textContent = "";
  var list = eventsOn(key);
  if(hideAllDay) list = list.filter(function(e){ return !e.allDay; });   // 오늘 카드: 시간대별로 챙길 일정만 (종일 일정은 달력에서 확인)
  if(!list.length){
    var li = el("li");
    var msg = key === todayKey ? "오늘은 일정이 없어요." : "이 날은 일정이 없어요.";
    if(LOADED.indexOf(monthOf(key)) === -1 && officialShown()){
      msg = monthName(monthOf(key))+" 플레이브 공식 일정은 아직 불러오지 않았어요.";
    } else if(state.show === "video"){
      msg = key === todayKey ? "오늘은 올라온 영상이 없어요." : "이 날 올라온 영상이 없어요.";
    } else if(state.show === "fan" && !ALL.some(function(e){return e.src==="fan";})){
      msg = "플리 일정은 아직 비어 있어요. 티켓팅·예약 일정이 추가되면 여기에 보여요.";
    }
    li.appendChild(el("p","empty",msg));
    if(key === todayKey && state.show !== "video" && /^오늘은 일정이 없어요/.test(msg)){
      var nx = nextLine(key);
      if(nx) li.appendChild(nx);
    }
    ul.appendChild(li);
    return;
  }
  list.forEach(function(e){
    var li = el("li","item src-"+e.src+((e.src==="plave" && (/\brelease\b|KEEP IT MANIC|CONCERT|콘서트/i.test(e.title))) ? " gbox" : ""));
    if(e.src==="plave" && /'s\s+day/i.test(e.title)){   // 생일: 달력 칸과 같은 멤버 색
      var mc = memberColor(e.title);
      li.style.cssText = "--cb:"+mc+"26;--cbar:"+mc+";--cf:var(--ink)";
    }
    if(e.src === "video") li.className += " no-time";
    else li.appendChild(el("div","t"+(e.allDay?" allday":""),e.time));
    var body = el("div");
    body.appendChild(el("div","ti",e.title));
    if(e.note) body.appendChild(el("div","memo",e.note));
    if(e.links.length){
      var ls = el("div","links");
      e.links.forEach(function(u,i){
        var a = el("a",null,hostLabel(u)+(e.links.length>1 ? " "+(i+1) : "")+" 열기");
        a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
        ls.appendChild(a);
      });
      body.appendChild(ls);
    }
    li.appendChild(body);
    ul.appendChild(li);
  });
}

function setPressed(boxId, key){
  var bs = document.getElementById(boxId).querySelectorAll("button");
  for(var i=0;i<bs.length;i++){
    bs[i].setAttribute("aria-pressed", bs[i].getAttribute("data-k") === key ? "true" : "false");
  }
}

function weekKeys(){
  var start = addDays(state.sel, -dowOf(state.sel));
  var out = [];
  for(var i=0;i<7;i++) out.push(addDays(start,i));
  return out;
}

function renderTitleAndNote(){
  var months = [];
  var title;
  if(state.view === "month"){
    months = [monthOf(state.sel)];
    title = monthName(months[0]);
  } else {
    var wk = weekKeys();
    wk.forEach(function(k){ if(months.indexOf(monthOf(k)) === -1) months.push(monthOf(k)); });
    var a = wk[0].split("-").map(Number), b = wk[6].split("-").map(Number);
    title = a[0]+"년 "+a[1]+"월 "+a[2]+"일 – "+(a[1]===b[1] ? "" : b[1]+"월 ")+b[2]+"일";
  }
  document.getElementById("title").textContent = title;
  var missing = months.filter(function(m){ return LOADED.indexOf(m) === -1; });
  var note = document.getElementById("note");
  if(missing.length && officialShown()){
    note.hidden = false;
    note.textContent = missing.map(monthName).join(", ")+" 플레이브 공식 일정은 아직 불러오지 않았어요."+(LOADED.length ? " 지금은 "+monthName(LOADED[0])+(LOADED.length>1 ? " ~ "+monthName(LOADED[LOADED.length-1]) : "")+" 공식 일정이 들어 있습니다." : "");
  } else { note.hidden = true; }
}

/* 달력 칸에 보일 제목: 맨 앞의 PLAVE(플레이브) 는 뺌 (팝업에는 제목 전체가 나와요) */
function cellTitle(s, src){
  var r = s.replace(/^\s*PLAVE\s*(?:\(\s*플레이브\s*\))?\s*[-–:|·]?\s*/i, "") || s;
  if(src !== "plave") return r;
  var HEART = "(?:💙|💜|🩷|💗|❤️|❤|🖤)+";
  var hm = r.match(new RegExp("^(.*?)\\s*(" + HEART + ")\\s*$"));
  var body = hm ? hm[1] : r, hs = hm ? hm[2] : "";
  var n = (hs.match(/💙|💜|🩷|💗|❤|🖤/g) || []).length;
  if(/weverse\s*live|위버스\s*(?:live|라이브)/i.test(r)){   // 위버스 라이브: 멤버 하트만 (하트가 없으면 제목 그대로)
    return hs ? hs : r;
  }
  if(/^(?:[\w'’\-]+\s+){0,2}(?:LIVE|라이브)$/i.test(body.trim())){   // 유튜브 라이브: LIVE (일부 멤버만 나오면 하트도)
    return "LIVE";
  }
  if(/KEEP IT MANIC|CONCERT|콘서트/i.test(r)){   // 콘서트: 🔥 + 도시·회차만
    var c = r.replace(/\[[^\]]*\]\s*/g, "").replace(/^\s*in\s+/i, "").trim();
    return "🔥 " + (c || r);
  }
  if(/\bRELEASE\b/i.test(r)){   // 릴리즈만 💿 + 이름 (M/V 등 다른 영상 일정에는 안 붙임)
    var t = r.replace(/\s*(?:ALBUM|DIGITAL)?\s*RELEASE\b/i, "").trim();
    return t || r;
  }
  if(/\b(?:MBC|KBS|SBS|Mnet|JTBC|tvN|FM4U)\b|COUNTDOWN|라디오|FM|어워드|AWARD|뮤직뱅크|인기가요|음악중심/i.test(r)) return r;   // 방송: 방송국 이름만
  return r;
}
function icoOf(e, shown){
  var t = e.title;
  if(e.src === "fan") return /티켓|예매|예약|응모|추첨/.test(t) ? "🎫" : "";
  if(e.src !== "plave" || e.allDay) return "";
  if(/^[💙💜🩷💗❤️❤🖤\s]+$/.test(shown) || shown === "LIVE" || /KEEP IT MANIC|CONCERT|콘서트/i.test(t)) return "";
  if(/라디오|FM4U|\bFM\b|radio/i.test(t)) return "📻";
  if(/어워드|AWARD|\bMMA\b|MAMA|시상식/i.test(t)) return "🏆";
  if(/음악중심|뮤직뱅크|인기가요|COUNTDOWN|엠카|쇼챔|더쇼|\b(?:MBC|KBS|SBS|Mnet|JTBC|tvN)\b/i.test(t)) return "📺";
  if(/발매/.test(t)) return "💿";
  if(/birthday|생일/i.test(t)) return "🎂";
  return "";
}
function stripBracket(s){ return s.replace(/^(\s*\[[^\]]*\]\s*)+/,"") || s; }
var MEMBER_COLOR = [[/yejun|예준/i,"#3b82f6"],[/noah|노아/i,"#8b5cf6"],[/bamby|밤비/i,"#ec6fa5"],[/eunho|은호/i,"#e5484d"],[/hamin|하민/i,"#2fa866"]];
function memberColor(t){
  for(var i=0;i<MEMBER_COLOR.length;i++) if(MEMBER_COLOR[i][0].test(t)) return MEMBER_COLOR[i][1];
  return "#d9a400";
}
function renderMonth(box){
  var ym = monthOf(state.sel);
  var p = ym.split("-").map(Number);
  var y = p[0], m = p[1];
  var byDay = {};
  ALL.forEach(function(e){
    if(monthOf(e.key) !== ym || !visible(e)) return;
    (byDay[e.key] = byDay[e.key] || []).push(e);
  });
  var grid = el("div","grid");
  DOW.forEach(function(d,i){ grid.appendChild(el("div","dow"+(i===0?" sun":i===6?" sat":""),d)); });
  var lead = new Date(Date.UTC(y,m-1,1)).getUTCDay();
  var days = new Date(Date.UTC(y,m,0)).getUTCDate();
  for(var i=0;i<lead;i++) grid.appendChild(el("div","blank"));
  for(var d=1; d<=days; d++){
    var key = y+"-"+pad(m)+"-"+pad(d);
    var wd = (lead + d - 1) % 7;
    var list = byDay[key] || [];
    var b = el("button","day"+(wd===0?" sun":wd===6?" sat":"")+(key===todayKey?" today":"")+(key<todayKey?" past":""));
    b.type = "button";
    b.setAttribute("aria-pressed", key === state.sel ? "true" : "false");
    b.setAttribute("aria-label", m+"월 "+d+"일, 일정 "+list.length+"건");
    var bdEv = list.filter(function(e){ return e.src==="plave" && /'s\s+day/i.test(e.title); })[0];   // 실제 생일날(Happy ○○'s Day)만
    var isBd = !!bdEv;
    var isRel = list.some(function(e){ return e.src==="plave" && /\brelease\b/i.test(e.title); });
    var nr = el("span","numrow");
    var ns = el("span","num"); ns.appendChild(el("span","nn",String(d))); nr.appendChild(ns);
    b.appendChild(nr);
    list.slice(0,3).forEach(function(e){
      var c = el("span","chip src-"+e.src);
      if(e.src === "plave"){   // 릴리즈·생일은 (종일이든 시간이 있든) 진한 색 칸에 흰 글씨
        if(/\brelease\b/i.test(e.title)) c.className += " gchip";   // 릴리즈: 초록 박스
        else if(/'s\s+day/i.test(e.title)){ var sc = memberColor(e.title); c.className += " strong"; c.style.background = sc; c.style.borderLeftColor = sc; }
      }
      var isShort = e.title.indexOf("[Shorts] ") === 0;
      var bday = (/birthday|b-?day|생일/i.test(e.title) && !/'s\s+day/i.test(e.title)) ? "🎂 " : "";   // 생일 관련 콘텐츠는 제목 앞에 🎂
      var cat = "";   // 종류 이모지(🔥 콘서트·📺 방송·🚨 릴리즈·🎂 생일)는 시간 옆에 작게
      if(e.src === "plave" && !isShort){
        var cm = cellTitle(e.title, "plave").match(/^(🔥|📺) /);
        if(cm) cat = cm[1];
        if(e.allDay && /'s\s+day/i.test(e.title)) cat = "🎂";
      }
      var isYL = (e.src === "plave" && !isShort && cellTitle(e.title, "plave") === "LIVE");   // 유튜브 라이브: 이모지 없이 초록 박스
      if(e.src !== "video"){   // 영상은 칸에 시간을 적지 않아요 (상세 팝업에서만)
        var tlabel = e.time;
        if(e.allDay && e.src === "plave"){   // 종일 대신 의미 있는 말: 릴리즈·생일 (그 밖의 종일 일정은 글자 없이 제목만)
          tlabel = /\brelease\b/i.test(e.title) ? "릴리즈" : (/'s\s+day/i.test(e.title) ? "생일" : "");
        }
        if(tlabel || cat){
          var bt = el("b",null,tlabel);
          bt.className = "tm";
          if(cat){ var te = el("span","em tem",cat); bt.appendChild(te); }
          c.appendChild(bt);
        }
      }
      if(isShort){
        c.className += " is-short";
        c.appendChild(el("span","sh","[Shorts]"));
        var hm = e.title.slice(9).match(/^((?:💙|💜|🩷|❤️|🖤)+)/);   // 쇼츠는 멤버 하트까지만
        if(hm){ c.appendChild(rich(el("span","ct-hearts"),bday+hm[1])); }
        else {   // 하트가 없는 쇼츠는 제목을 이어서 보여줌
          var sfull = cellTitle(e.title.slice(9));
          c.appendChild(rich(el("span","ct-full"),bday+sfull));
          c.appendChild(rich(el("span","ct-short"),bday+stripBracket(sfull)));
        }
      } else {
        var full = cellTitle(e.title, e.src);
        if(e.allDay && e.src === "plave" && EMO_LEAD && !/release|'s\s+day/i.test(e.title)){   // 종일 일정은 이모지 없이
          var nf = full.replace(EMO_LEAD, "");
          if(nf) full = nf;
        }
        if(e.allDay && e.src === "plave" && /'s\s+day/i.test(e.title)){   // 생일: 🎂 + 멤버 이름
          var bm = e.title.match(/happy\s+(.+?)['’]s\s+day/i);
          full = "🎂 " + (bm ? bm[1] : full);
        }
        if(cat && full.indexOf(cat + " ") === 0) full = full.slice(cat.length + 1);   // 이모지는 시간 옆으로 옮겼으니 제목에서는 뺌
        if(cat === "🔥") full = full + " Concert";   // 콘서트: 지역 뒤에 Concert
        var pre = e.ch ? "["+e.ch+"] " : "";   // 공식 채널이 아닌 영상은 채널 이름을 앞에
        var rest = pre ? full.slice(pre.length) : full;
        var lv = false;   // LIVE 는 이제 일반 칸 (🎙️ 이모지만 앞에)
        if(isYL) c.className += " is-live";
        var cn = cat === "🔥";   // 콘서트: 주황 CON 배지 + 도시·회차   // 유튜브 라이브: 어두운 배지로 눈에 띄게
        function put(cls, text){
          var sp = el("span",cls,"");
          if(cn){
            rich(sp, text);   // 콘서트: 🔥 도시·회차
          } else if(lv){
            sp.appendChild(rich(el("span","lv"),"LIVE"));
            var tl = text.slice("LIVE".length).trim();
            if(tl){ sp.appendChild(document.createTextNode(" ")); rich(sp, tl); }
          } else rich(sp, text);
          c.appendChild(sp);
        }
        if(lv){ c.className += " is-live strong"; c.style.background = "#26304d"; }   // 박스 안의 박스 대신 칸 전체를 진하게
        if(cn) c.className += " gchip";   // 콘서트: 초록 박스
        put("ct-full", lv ? full : bday+full);
        put("ct-short", lv ? full : (cn ? full.replace(/\s*Concert$/i,"") : bday+pre+(e.src === "video" ? rest : stripBracket(rest))));   // 영상은 [] 안 글자도 그대로 / 폰의 콘서트는 도시만
        var ico = icoOf(e, full);   // 폰: 제목 대신 종류 아이콘 (제목은 날짜 팝업에서)
        if(ico){ c.className += " has-ico"; c.appendChild(el("span","ico",ico)); }
      }
      b.appendChild(c);
    });
    if(list.length > 3) b.appendChild(el("span","more","+"+(list.length-3)+"건 더"));
    if(list.length > 2) b.appendChild(el("span","more2","+"+(list.length-2)));
    (function(k){ b.addEventListener("click", function(){ selectKey(k); }); })(key);
    grid.appendChild(b);
  }
  var tail = (7 - (lead + days) % 7) % 7;
  for(var j=0;j<tail;j++) grid.appendChild(el("div","blank"));
  box.appendChild(grid);
}

function renderWeek(box){
  var wrap = el("div","week");
  weekKeys().forEach(function(key){
    var wd = dowOf(key);
    var p = key.split("-").map(Number);
    var col = el("div","wcol"+(key===todayKey?" today":"")+(key===state.sel?" selected":""));
    var h = el("button","wh"+(wd===0?" sun":wd===6?" sat":""));
    h.type = "button";
    h.setAttribute("aria-label", p[1]+"월 "+p[2]+"일 "+DOWL[wd]+" 선택");
    h.appendChild(el("span","d",String(p[2])));
    h.appendChild(el("span","w",DOW[wd]));
    h.addEventListener("click", function(){ selectKey(key); });
    col.appendChild(h);
    var list = el("div","wlist");
    var evs = eventsOn(key);
    if(!evs.length) list.appendChild(el("p","wnone","일정 없음"));
    evs.forEach(function(e){
      var w = el("div","wev src-"+e.src);
      w.appendChild(el("div","wt"+(e.allDay?" allday":""),e.time));
      w.appendChild(el("div","wn",e.title));
      list.appendChild(w);
    });
    col.appendChild(list);
    wrap.appendChild(col);
  });
  box.appendChild(wrap);
}

function render(){
  setPressed("showseg", state.show);
  document.getElementById("vidbtn").setAttribute("aria-pressed", state.show === "video" ? "true" : "false");
  var fb = document.getElementById("fbtn");
  fb.className = "fbtn" + (state.show === "plave" || state.show === "fan" ? " on" : state.show === "video" ? " dim" : "");
  document.getElementById("legend").hidden = state.show === "video";
  renderSelected();
  renderTitleAndNote();
  var box = document.getElementById("cal");
  box.textContent = "";
  if(state.view === "month") renderMonth(box); else renderWeek(box);
}

function step(dir){
  if(state.view === "week"){
    state.sel = addDays(state.sel, 7*dir);
  } else {
    var p = monthOf(state.sel).split("-").map(Number);
    var d = new Date(Date.UTC(p[0], p[1]-1+dir, 1));
    var ym = d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1);
    state.sel = ym === monthOf(todayKey) ? todayKey : ym+"-01";
  }
  render();
}
document.getElementById("prev").addEventListener("click", function(){ step(-1); });
document.getElementById("next").addEventListener("click", function(){ step(1); });
document.getElementById("dlgx").addEventListener("click", closeDay);
document.getElementById("daydlg").addEventListener("click", function(ev){ if(ev.target === this) closeDay(); });
document.getElementById("vidbtn").addEventListener("click", function(){ state.show = state.show === "video" ? "all" : "video"; render(); });
function togglePop(open){
  var pop = document.getElementById("showseg"), fb = document.getElementById("fbtn");
  var want = open === undefined ? pop.hidden : open;
  pop.hidden = !want;
  fb.setAttribute("aria-expanded", want ? "true" : "false");
}
document.getElementById("fbtn").addEventListener("click", function(ev){
  ev.stopPropagation();
  if(state.show === "plave" || state.show === "fan"){ state.show = "all"; togglePop(false); render(); return; }   // 필터가 켜져 있으면 먼저 전체로
  togglePop();
});
document.getElementById("showseg").addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("button") : ev.target;
  var k = b && b.getAttribute && b.getAttribute("data-k");
  if(k){ state.show = k; togglePop(false); render(); }
});
document.addEventListener("click", function(ev){
  var w = document.querySelector(".fwrap");
  if(w && !w.contains(ev.target)) togglePop(false);
});
document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") togglePop(false); });
(function(){
  var base = location.host + location.pathname.replace(/[^\/]*$/, "") + "schedule.ics";
  var web = "webcal://" + base;
  document.getElementById("al-ios").href = web;
  document.getElementById("al-g").href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(web);
  var d = document.getElementById("alarmdlg");
  function openA(){ try{ if(d.showModal) d.showModal(); else d.setAttribute("open",""); }catch(x){ d.setAttribute("open",""); } }
  function closeA(){ try{ if(d.close) d.close(); else d.removeAttribute("open"); }catch(x){ d.removeAttribute("open"); } }
  document.getElementById("alarmbtn").addEventListener("click", openA);
  document.getElementById("alarmx").addEventListener("click", closeA);
  d.addEventListener("click", function(ev){ if(ev.target === d) closeA(); });
})();
document.getElementById("updated").textContent = "공식 일정 마지막 확인: " + UPDATED + " (한국 시간)";
render();
</script>
